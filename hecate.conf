<VirtualHost *:80>
    ServerName hecate.local

    DocumentRoot /var/www/hecate/public
    DirectoryIndex index.php

    <Directory /var/www/hecate/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hecate-error.log
    CustomLog ${APACHE_LOG_DIR}/hecate-access.log combined
</VirtualHost>
