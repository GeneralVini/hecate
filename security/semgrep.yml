rules:
  - id: hecate.php.dangerous-shell-execution
    languages: [php]
    severity: ERROR
    message: Execução direta de shell não é permitida no HECATE Web; use operações fechadas no hecate-agent.
    patterns:
      - pattern-either:
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: system(...)
          - pattern: passthru(...)
          - pattern: proc_open(...)
          - pattern: popen(...)

  - id: hecate.php.unsafe-unserialize
    languages: [php]
    severity: ERROR
    message: unserialize() em dados não confiáveis pode permitir object injection. Use formato seguro ou valide explicitamente a origem.
    pattern: unserialize(...)

  - id: hecate.php.dynamic-include
    languages: [php]
    severity: WARNING
    message: include/require dinâmico deve ser evitado ou protegido por allowlist explícita.
    patterns:
      - pattern-either:
          - pattern: include $X
          - pattern: include_once $X
          - pattern: require $X
          - pattern: require_once $X
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: "'...'"
            - pattern-not: '"..."'

  - id: hecate.php.sql-string-concatenation
    languages: [php]
    severity: WARNING
    message: SQL construído por concatenação exige revisão. Prefira parâmetros/bindings e allowlist para identificadores dinâmicos.
    patterns:
      - pattern-either:
          - pattern: $DB->query($A . $B)
          - pattern: $DB->createCommand($A . $B)
          - pattern: $PDO->exec($A . $B)
          - pattern: $PDO->query($A . $B)

  - id: hecate.php.raw-request-superglobal-in-sql
    languages: [php]
    severity: ERROR
    message: Entrada HTTP não pode ser inserida diretamente em SQL.
    patterns:
      - pattern-either:
          - pattern: $DB->query(... $_GET[...] ...)
          - pattern: $DB->query(... $_POST[...] ...)
          - pattern: $DB->query(... $_REQUEST[...] ...)
          - pattern: $PDO->query(... $_GET[...] ...)
          - pattern: $PDO->query(... $_POST[...] ...)
          - pattern: $PDO->query(... $_REQUEST[...] ...)
