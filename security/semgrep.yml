rules:
  - id: hecate.php.dangerous-shell-execution
    languages: [php]
    severity: ERROR
    message: Execução direta de shell não é permitida no HECATE Web; use operações fechadas no hecate-agent.
    patterns:
      - pattern-either:
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: system(...)
          - pattern: passthru(...)
          - pattern: proc_open(...)
          - pattern: popen(...)
          - pattern: eval(...)

  - id: hecate.php.unsafe-unserialize
    languages: [php]
    severity: ERROR
    message: unserialize() exige revisão de segurança; prefira formatos seguros e dados com origem controlada.
    pattern: unserialize(...)

  - id: hecate.php.sql-string-concatenation
    languages: [php]
    severity: ERROR
    message: SQL construído por concatenação exige revisão. Use parâmetros/bindings e allowlist para identificadores dinâmicos.
    patterns:
      - pattern-either:
          - pattern: $DB->query($A . $B)
          - pattern: $DB->createCommand($A . $B)
          - pattern: $PDO->exec($A . $B)
          - pattern: $PDO->query($A . $B)

  - id: hecate.php.sql-sprintf
    languages: [php]
    severity: ERROR
    message: SQL montado com sprintf() exige revisão. Valores devem usar binding; identificadores dinâmicos exigem allowlist.
    patterns:
      - pattern-either:
          - pattern: $DB->createCommand(sprintf(...))
          - pattern: $PDO->query(sprintf(...))
          - pattern: $PDO->exec(sprintf(...))

  - id: hecate.php.dynamic-include
    languages: [php]
    severity: ERROR
    message: include/require dinâmico pode permitir LFI/path traversal. Use caminhos fixos ou allowlist estrita.
    patterns:
      - pattern-either:
          - pattern: include $X
          - pattern: include_once $X
          - pattern: require $X
          - pattern: require_once $X
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: "'...'"
            - pattern-not: '"..."'

  - id: hecate.php.filesystem-path-concatenation
    languages: [php]
    severity: WARNING
    message: Caminho de filesystem construído por concatenação exige validação de base path e proteção contra path traversal.
    patterns:
      - pattern-either:
          - pattern: file_get_contents($A . $B)
          - pattern: file_put_contents($A . $B, ...)
          - pattern: fopen($A . $B, ...)
          - pattern: unlink($A . $B)
          - pattern: rename($A . $B, ...)
          - pattern: copy($A . $B, ...)

  - id: hecate.php.curl-dynamic-url
    languages: [php]
    severity: WARNING
    message: URL dinâmica em cURL exige allowlist de esquema/host e bloqueio de destinos internos para reduzir SSRF.
    patterns:
      - pattern: curl_setopt($CURL, CURLOPT_URL, $URL)
      - metavariable-pattern:
          metavariable: $URL
          patterns:
            - pattern-not: "'...'"
            - pattern-not: '"..."'

  - id: hecate.php.remote-file-dynamic-url
    languages: [php]
    severity: WARNING
    message: Acesso remoto por URL dinâmica exige validação/allowlist para evitar SSRF.
    patterns:
      - pattern: file_get_contents($URL)
      - metavariable-regex:
          metavariable: $URL
          regex: '^\$.*'

  - id: hecate.php.header-concatenation
    languages: [php]
    severity: WARNING
    message: Header HTTP construído por concatenação pode permitir header injection ou open redirect.
    pattern: header($A . $B)

  - id: hecate.php.location-header-variable
    languages: [php]
    severity: WARNING
    message: Redirect com destino variável exige URL interna gerada pelo router ou allowlist explícita.
    patterns:
      - pattern: header($HEADER)
      - metavariable-regex:
          metavariable: $HEADER
          regex: '^\$.*'

  - id: hecate.php.html-no-encode
    languages: [php]
    severity: WARNING
    message: Desabilitar encoding HTML cria hotspot de XSS. Documente a origem confiável ou mantenha encoding ativo.
    patterns:
      - pattern-either:
          - pattern: $X->encode(false)
          - pattern: NoEncode::string($X)

  - id: hecate.php.raw-echo-request
    languages: [php]
    severity: ERROR
    message: Dados vindos diretamente da requisição não devem ser enviados ao HTML sem escaping contextual.
    patterns:
      - pattern-either:
          - pattern: echo $_GET[$KEY]
          - pattern: echo $_POST[$KEY]
          - pattern: echo $_REQUEST[$KEY]
          - pattern: print $_GET[$KEY]
          - pattern: print $_POST[$KEY]
          - pattern: print $_REQUEST[$KEY]

  - id: hecate.php.raw-superglobal-html-concat
    languages: [php]
    severity: ERROR
    message: Concatenar entrada HTTP diretamente em HTML cria risco de XSS.
    patterns:
      - pattern-either:
          - pattern: echo $A . $_GET[$KEY] . $B
          - pattern: echo $A . $_POST[$KEY] . $B
          - pattern: echo $A . $_REQUEST[$KEY] . $B

  - id: hecate.php.log-password
    languages: [php]
    severity: ERROR
    message: Senha não pode ser registrada em logs.
    patterns:
      - pattern-either:
          - pattern: error_log($PASSWORD)
          - pattern: $LOGGER->debug($PASSWORD)
          - pattern: $LOGGER->info($PASSWORD)
          - pattern: $LOGGER->warning($PASSWORD)
          - pattern: $LOGGER->error($PASSWORD)
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: '(?i)^\$(password|passwd|senha|credential|credentials)$'

  - id: hecate.php.log-token-secret
    languages: [php]
    severity: ERROR
    message: Token, cookie, Authorization ou secret não devem ser registrados em logs.
    patterns:
      - pattern-either:
          - pattern: error_log($SECRET)
          - pattern: $LOGGER->debug($SECRET)
          - pattern: $LOGGER->info($SECRET)
          - pattern: $LOGGER->warning($SECRET)
          - pattern: $LOGGER->error($SECRET)
      - metavariable-regex:
          metavariable: $SECRET
          regex: '(?i)^\$(token|secret|client_secret|authorization|cookie)$'

  - id: hecate.php.debug-output-sensitive
    languages: [php]
    severity: WARNING
    message: Saída de depuração pode expor dados sensíveis; não deixe var_dump/print_r em código de aplicação.
    patterns:
      - pattern-either:
          - pattern: var_dump(...)
          - pattern: print_r(...)
