name: QA

on:
  push:
    branches:
      - yii3
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Semgrep CE
        run: python3 -m pip install --disable-pip-version-check semgrep==1.177.0

      - name: Validate Composer metadata
        run: composer validate --no-interaction

      - name: Run project quality and security checks
        env:
          HECATE_SEMGREP_BIN: semgrep
        run: composer check
