name: QA

on:
  push:
    branches:
      - yii3
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-yii3
          path: composer.lock
          if-no-files-found: error

      - name: Validate Composer metadata
        run: composer validate --no-interaction

      - name: Run project QA
        run: composer qa
