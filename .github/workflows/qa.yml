name: QA

on:
  push:
    branches:
      - yii3
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/yii3' && hashFiles('composer.lock') != ''
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: add Yii3 dependency lockfile'
          git push origin HEAD:yii3

      - name: Validate Composer metadata
        run: composer validate --no-interaction

      - name: Run project QA
        run: composer qa
